# Local stack: PostgreSQL with pgvector, migrations, API, worker and frontend.
# Usage, from the repository root:
#   sed "s/^ADMIN_API_TOKEN=$/ADMIN_API_TOKEN=$(openssl rand -hex 32)/" .env.example > .env
#   docker compose up --build
# Load the demo knowledge base once: docker compose run --rm seed
name: handoff-ai

# One backend image, built by the `backend` service and reused by the others.
x-backend: &backend
  image: handoff-ai-backend:local
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-handoff}:${POSTGRES_PASSWORD:-handoff}@db:5432/${POSTGRES_DB:-handoff}
    # Without a token every admin request is rejected, so the stack refuses to start instead.
    ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?set it in .env; generate one with `openssl rand -hex 32`}

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-handoff}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-handoff}
      POSTGRES_DB: ${POSTGRES_DB:-handoff}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # One-off: loads the Northline demo documents. Not started by `docker compose up`.
  seed:
    <<: *backend
    profiles: ["seed"]
    command: ["python", "-m", "scripts.seed_knowledge_base"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:8080"

volumes:
  db-data:
