<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">How RAG Support Assistant answers from documents</title>
<desc id="desc">Indexing: upload, split into passages, embed, store the active version in PostgreSQL with pgvector. Answering: check the message, find passages, write the reply from them, verify citations. Outcomes: a grounded answer with sources, a knowledge gap with a human handoff, or a purchase inquiry delivered to the CRM after confirmation.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6E7681"/></marker></defs>
<rect width="960" height="640" rx="14" fill="#0D1117"/>
<text x="32" y="46" font-size="22" font-weight="700" fill="#E6EDF3" text-anchor="start">How RAG Support Assistant answers from documents</text>
<text x="32" y="72" font-size="14" font-weight="400" fill="#9198A1" text-anchor="start">Retrieval-augmented generation: search the company's documents first, then answer only from what was found.</text>
<rect x="24" y="92" width="912" height="178" rx="12" fill="#161B22" stroke="#30363D"/>
<text x="48" y="122" font-size="15" font-weight="700" fill="#AB7DF8" text-anchor="start">Indexing</text>
<text x="122" y="122" font-size="13" font-weight="400" fill="#9198A1" text-anchor="start">when a document is uploaded, in a background worker</text>
<rect x="48" y="142" width="196" height="104" rx="10" fill="#0D1117" stroke="#30363D"/>
<circle cx="70" cy="166" r="11" fill="#AB7DF8"/>
<text x="70" y="170.5" font-size="12" font-weight="700" fill="#161B22" text-anchor="middle">1</text>
<text x="88" y="171" font-size="15" font-weight="600" fill="#E6EDF3" text-anchor="start">Upload</text>
<text x="62" y="198" font-size="12.5" font-weight="400" fill="#9198A1" text-anchor="start">An admin uploads Markdown</text>
<text x="62" y="215" font-size="12.5" font-weight="400" fill="#9198A1" text-anchor="start">or a PDF with text. Each</text>
<text x="62" y="232" font-size="12.5" font-weight="400" fill="#9198A1" text-anchor="start">upload is a new version.</text>
<line x1="247" y1="194" x2="268" y2="194" stroke="#6E7681" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="272" y="142" width="196" height="104" rx="10" fill="#0D1117" stroke="#30363D"/>
<circle cx="294" cy="166" r="11" fill="#AB7DF8"/>
<text x="294" y="170.5" font-size="12" font-weight="700" fill="#161B22" text-anchor="middle">2</text>
<text x="312" y="171" font-size="15" font-weight="600" fill="#E6EDF3" text-anchor="start">Split into passages</text>
<text x="286" y="198" font-size="12.5" font-weight="400" fill="#9198A1" text-anchor="start">By headings and pages,</text>
<text x="286" y="215" font-size="12.5" font-weight="400" fill="#9198A1" text-anchor="start">up to 1,200 characters</text>
<text x="286" y="232" font-size="12.5" font-weight="400" fill="#9198A1" text-anchor="start">per passage.</text>
<line x1="471" y1="194" x2="492" y2="194" stroke="#6E7681" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="496" y="142" width="196" height="104" rx="10" fill="#0D1117" stroke="#30363D"/>
<circle cx="518" cy="166" r="11" fill="#AB7DF8"/>
<text x="518" y="170.5" font-size="12" font-weight="700" fill="#161B22" text-anchor="middle">3</text>
<text x="536" y="171" font-size="15" font-weight="600" fill="#E6EDF3" text-anchor="start">Embed</text>
<text x="510" y="198" font-size="12.5" font-weight="400" fill="#9198A1" text-anchor="start">Each passage becomes a</text>
<text x="510" y="215" font-size="12.5" font-weight="400" fill="#9198A1" text-anchor="start">vector: an embedding API,</text>
<text x="510" y="232" font-size="12.5" font-weight="400" fill="#9198A1" text-anchor="start">or word matching in demo.</text>
<line x1="695" y1="194" x2="716" y2="194" stroke="#6E7681" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="720" y="142" width="196" height="104" rx="10" fill="#0D1117" stroke="#30363D"/>
<circle cx="742" cy="166" r="11" fill="#AB7DF8"/>
<text x="742" y="170.5" font-size="12" font-weight="700" fill="#161B22" text-anchor="middle">4</text>
<text x="760" y="171" font-size="15" font-weight="600" fill="#E6EDF3" text-anchor="start">Store and activate</text>
<text x="734" y="198" font-size="12.5" font-weight="400" fill="#9198A1" text-anchor="start">PostgreSQL + pgvector.</text>
<text x="734" y="215" font-size="12.5" font-weight="400" fill="#9198A1" text-anchor="start">Only the active version</text>
<text x="734" y="232" font-size="12.5" font-weight="400" fill="#9198A1" text-anchor="start">of a document is searched.</text>
<rect x="24" y="300" width="912" height="316" rx="12" fill="#161B22" stroke="#30363D"/>
<text x="48" y="330" font-size="15" font-weight="700" fill="#4493F8" text-anchor="start">Answering</text>
<text x="132" y="330" font-size="13" font-weight="400" fill="#9198A1" text-anchor="start">for each visitor message</text>
<rect x="48" y="350" width="196" height="104" rx="10" fill="#0D1117" stroke="#30363D"/>
<circle cx="70" cy="374" r="11" fill="#4493F8"/>
<text x="70" y="378.5" font-size="12" font-weight="700" fill="#161B22" text-anchor="middle">1</text>
<text x="88" y="379" font-size="15" font-weight="600" fill="#E6EDF3" text-anchor="start">Check the message</text>
<text x="62" y="406" font-size="12.5" font-weight="400" fill="#9198A1" text-anchor="start">Override attempts are</text>
<text x="62" y="423" font-size="12.5" font-weight="400" fill="#9198A1" text-anchor="start">declined. Buying intent</text>
<text x="62" y="440" font-size="12.5" font-weight="400" fill="#9198A1" text-anchor="start">opens an inquiry.</text>
<line x1="247" y1="402" x2="268" y2="402" stroke="#6E7681" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="272" y="350" width="196" height="104" rx="10" fill="#0D1117" stroke="#30363D"/>
<circle cx="294" cy="374" r="11" fill="#4493F8"/>
<text x="294" y="378.5" font-size="12" font-weight="700" fill="#161B22" text-anchor="middle">2</text>
<text x="312" y="379" font-size="15" font-weight="600" fill="#E6EDF3" text-anchor="start">Find passages</text>
<text x="286" y="406" font-size="12.5" font-weight="400" fill="#9198A1" text-anchor="start">Message + recent turns</text>
<text x="286" y="423" font-size="12.5" font-weight="400" fill="#9198A1" text-anchor="start">become one query vector.</text>
<text x="286" y="440" font-size="12.5" font-weight="400" fill="#9198A1" text-anchor="start">Best 8 of 20 are kept.</text>
<line x1="471" y1="402" x2="492" y2="402" stroke="#6E7681" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="496" y="350" width="196" height="104" rx="10" fill="#0D1117" stroke="#30363D"/>
<circle cx="518" cy="374" r="11" fill="#4493F8"/>
<text x="518" y="378.5" font-size="12" font-weight="700" fill="#161B22" text-anchor="middle">3</text>
<text x="536" y="379" font-size="15" font-weight="600" fill="#E6EDF3" text-anchor="start">Write the reply</text>
<text x="510" y="406" font-size="12.5" font-weight="400" fill="#9198A1" text-anchor="start">The LLM answers from</text>
<text x="510" y="423" font-size="12.5" font-weight="400" fill="#9198A1" text-anchor="start">these passages only and</text>
<text x="510" y="440" font-size="12.5" font-weight="400" fill="#9198A1" text-anchor="start">names the ones it used.</text>
<line x1="695" y1="402" x2="716" y2="402" stroke="#6E7681" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="720" y="350" width="196" height="104" rx="10" fill="#0D1117" stroke="#30363D"/>
<circle cx="742" cy="374" r="11" fill="#4493F8"/>
<text x="742" y="378.5" font-size="12" font-weight="700" fill="#161B22" text-anchor="middle">4</text>
<text x="760" y="379" font-size="15" font-weight="600" fill="#E6EDF3" text-anchor="start">Verify citations</text>
<text x="734" y="406" font-size="12.5" font-weight="400" fill="#9198A1" text-anchor="start">A cited passage must be</text>
<text x="734" y="423" font-size="12.5" font-weight="400" fill="#9198A1" text-anchor="start">one that was retrieved,</text>
<text x="734" y="440" font-size="12.5" font-weight="400" fill="#9198A1" text-anchor="start">or the reply is a gap.</text>
<path d="M818.0 246 V285 H370.0 V346" fill="none" stroke="#6E7681" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#head)"/>
<rect x="462.0" y="276" width="236" height="20" rx="10" fill="#0D1117"/>
<text x="580.0" y="290" font-size="12" font-weight="400" fill="#9198A1" text-anchor="middle">exact cosine search, active passages</text>
<line x1="818.0" y1="454" x2="818.0" y2="514" stroke="#6E7681" stroke-width="1.5" marker-end="url(#head)"/>
<path d="M818.0 484 H594.0 V514" fill="none" stroke="#6E7681" stroke-width="1.5" marker-end="url(#head)"/>
<line x1="146.0" y1="454" x2="146.0" y2="514" stroke="#6E7681" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="496" y="518" width="196" height="78" rx="10" fill="#12261E" stroke="#3FB950" stroke-opacity="0.55"/>
<rect x="496" y="530" width="4" height="54" rx="2" fill="#3FB950"/>
<text x="514" y="544" font-size="14.5" font-weight="600" fill="#3FB950" text-anchor="start">Grounded answer</text>
<text x="514" y="565" font-size="12.5" font-weight="400" fill="#E6EDF3" text-anchor="start">With sources: document,</text>
<text x="514" y="582" font-size="12.5" font-weight="400" fill="#E6EDF3" text-anchor="start">version, section, excerpt.</text>
<rect x="720" y="518" width="196" height="78" rx="10" fill="#272115" stroke="#D29922" stroke-opacity="0.55"/>
<rect x="720" y="530" width="4" height="54" rx="2" fill="#D29922"/>
<text x="738" y="544" font-size="14.5" font-weight="600" fill="#D29922" text-anchor="start">Knowledge gap</text>
<text x="738" y="565" font-size="12.5" font-weight="400" fill="#E6EDF3" text-anchor="start">No guess. Offers to pass</text>
<text x="738" y="582" font-size="12.5" font-weight="400" fill="#E6EDF3" text-anchor="start">the question to a person.</text>
<rect x="48" y="518" width="420" height="78" rx="10" fill="#121D2F" stroke="#4493F8" stroke-opacity="0.55"/>
<rect x="48" y="530" width="4" height="54" rx="2" fill="#4493F8"/>
<text x="66" y="544" font-size="14.5" font-weight="600" fill="#4493F8" text-anchor="start">Purchase inquiry</text>
<text x="66" y="565" font-size="12.5" font-weight="400" fill="#E6EDF3" text-anchor="start">A question in the same message is answered first, then</text>
<text x="66" y="582" font-size="12.5" font-weight="400" fill="#E6EDF3" text-anchor="start">a form is filled from the chat. The CRM gets it after confirmation.</text>
</svg>
