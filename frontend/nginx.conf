server {
    listen 8080;
    root /usr/share/nginx/html;

    # Keep in step with MAX_UPLOAD_BYTES: oversized uploads stop here, before the API.
    client_max_body_size 10m;

    # Docker's DNS. With the address in a variable, nginx resolves `backend` per request,
    # so it starts without the API and follows a restarted API container.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri /index.html;
    }
}
